<VirtualHost *:80>
    ServerName localhost
    ServerAdmin admin@localhost

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300

    # ── Basic auth ONLY for /reactjs ───────────────────────────────
    <Location /reactjs>
        AuthType Basic
        AuthName "Prototype Protected Area"
        AuthUserFile /usr/local/apache2/conf/.htpasswd
        Require valid-user
    </Location>

    # ── NodeJS API (no auth) ───────────────────────────────────────
    ProxyPass        /nodejs  http://prototype-application-proxy-nodejs:3000
    ProxyPassReverse /nodejs  http://prototype-application-proxy-nodejs:3000

    # ── phpMyAdmin (no auth) ───────────────────────────────────────
    ProxyPass        /pma  http://prototype-application-proxy-pma:80
    ProxyPassReverse /pma  http://prototype-application-proxy-pma:80

    # ── ReactJS (auth enforced above) ──────────────────────────────
    ProxyPass        /reactjs  http://prototype-application-proxy-reactjs:80
    ProxyPassReverse /reactjs  http://prototype-application-proxy-reactjs:80

    # ── Bare root → /reactjs (optional convenience) ────────────────
    RedirectMatch ^/$ /reactjs/

    ErrorLog  /usr/local/apache2/logs/proxy-error.log
    CustomLog /usr/local/apache2/logs/proxy-access.log common
</VirtualHost>
